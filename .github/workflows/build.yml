name: Build desktop apps

# v1.0.0 のようなタグができると（GitHub の Releases 画面で作成・または push）、
# テスト後に Windows / macOS 向けアプリをビルドして Release に添付する
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 画面の配色のテストは Tkinter のウィンドウを作るので、仮想ディスプレイ（Xvfb）の上で動かす
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements.txt
      - run: xvfb-run -a python -m unittest discover -s tests -v
      # リリースのタグ（v1.2.0 など）と、アプリに表示するバージョン（justdoit/__init__.py）がずれていたら止める
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'EOF'
          import os, sys
          import justdoit
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if justdoit.__version__ != tag:
              sys.exit(f"justdoit/__init__.py の __version__ ({justdoit.__version__}) がタグ ({tag}) と違います")
          print(f"バージョン {tag} を確認しました")
          EOF

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: JustDoIt-windows
          - os: macos-latest
            artifact: JustDoIt-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # 同梱するもの・しないものは JustDoIt.spec で管理する（ダウンロードを軽くするため）
      - run: pyinstaller --noconfirm JustDoIt.spec

      # ビルドしたアプリで画面を一通り表示して確かめる（同梱するファイルが足りず、配布版だけ動かない事故を防ぐ）
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        run: |
          $p = Start-Process dist/JustDoIt/JustDoIt.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content selftest.log -Encoding utf8
          exit $p.ExitCode
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          status=0
          "dist/Just do it.app/Contents/MacOS/JustDoIt" --self-test || status=$?
          cat selftest.log
          exit $status

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/JustDoIt -DestinationPath ${{ matrix.artifact }}.zip
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        # アプリ名（Just do it.app）に空白があるので、パスを引用符で囲む
        run: ditto -c -k --keepParent "dist/Just do it.app" ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: "*.zip"
