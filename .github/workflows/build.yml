name: Build desktop apps

# main への push とプルリクエスト（Dependabot によるバージョンアップを含む）では、テストとビルド・配布版の動作確認まで。
# v1.0.0 のようなタグができると（GitHub の Releases 画面で作成・または push）、ビルドしたアプリを Release に添付する
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # コードの書き方（ruff）と型（mypy）のチェック
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      # Windows・macOS 用の処理もあるので、それぞれの OS として型を確かめる
      # （OS ごとの分岐は sys.platform で書く。platform.system() だと mypy が見分けられない）
      - run: python -m mypy --platform linux
      - run: python -m mypy --platform win32
      - run: python -m mypy --platform darwin

  # 週次レポート配信サービス（GAS）のテスト。本物の配信サービスのコード（gas/report_service/*.js）を模擬環境に読み込んで確かめる
  gas-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node gas/tests/run.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 画面の配色のテストは Tkinter のウィンドウを作るので、仮想ディスプレイ（Xvfb）の上で動かす
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements-dev.txt
      # テストを実行しながら、テストがどれだけのコードを通ったか（カバレッジ）を測る
      - run: xvfb-run -a python -m coverage run -m unittest discover -s tests -v
      # 結果は、この実行のページ（Summary）に表で出す
      - run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      # リリースのタグ（v1.2.0 など）と、アプリに表示するバージョン（justdoit/__init__.py）がずれていたら止める。
      # 変更履歴（CHANGELOG.md）にそのバージョンの変更点が無いときも止める（リリースノートに使うため）
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'EOF'
          import os, sys
          import justdoit
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if justdoit.__version__ != tag:
              sys.exit(f"justdoit/__init__.py の __version__ ({justdoit.__version__}) がタグ ({tag}) と違います")
          print(f"バージョン {tag} を確認しました")
          EOF
          python tools/release_notes.py "$GITHUB_REF_NAME" > /dev/null

  build:
    needs: [lint, gas-test, test]
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: JustDoIt-windows
          - os: macos-latest
            artifact: JustDoIt-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # 同梱するもの・しないものは JustDoIt.spec で管理する（ダウンロードを軽くするため）
      - run: pyinstaller --noconfirm JustDoIt.spec

      # ビルドしたアプリで画面を一通り表示して確かめる（同梱するファイルが足りず、配布版だけ動かない事故を防ぐ）。
      # 各画面のスクリーンショットも撮って、この実行のページ（Summary の Artifacts）に保存する
      # （手元に Windows の PC が無くても、Windows での見た目を確かめられるように）
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        run: |
          $p = Start-Process dist/JustDoIt/JustDoIt.exe -ArgumentList "--self-test", "--screenshots", "screenshots" -Wait -PassThru
          Get-Content selftest.log -Encoding utf8
          exit $p.ExitCode
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          status=0
          "dist/Just do it.app/Contents/MacOS/JustDoIt" --self-test --screenshots screenshots || status=$?
          cat selftest.log
          exit $status

      # 動作確認が失敗したときも、どの画面がおかしいか見られるよう保存する
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ runner.os }}
          path: screenshots/
          if-no-files-found: ignore

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/JustDoIt -DestinationPath ${{ matrix.artifact }}.zip
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        # アプリ名（Just do it.app）に空白があるので、パスを引用符で囲む
        run: ditto -c -k --keepParent "dist/Just do it.app" ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # リリースノートは CHANGELOG.md のそのバージョンの部分から作る（Releases 画面で説明文を書かなくてよい）
      - run: python tools/release_notes.py "$GITHUB_REF_NAME" > release_notes.md
      # 配布する zip だけを集める（スクリーンショットは添付しない）
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: JustDoIt-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: "artifacts/*.zip"
          body_path: release_notes.md
